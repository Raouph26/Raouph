#
# Builds the game and publishes it to GitHub Pages.
#
# The Pages URL is what PWABuilder reads to generate the Android package, so
# this workflow is the only hosting step required — no third-party service is
# involved anywhere in the chain.
#
# One-time setup in the repository: Settings > Pages > Source: "GitHub Actions".
#
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The catalogue is generated on device, so a broken generator would ship
      # unplayable levels. Tests gate the deploy rather than trailing it.
      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
