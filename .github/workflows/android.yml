name: Build the Android app

# The studio has no Android tooling on their machine, so the app is built here
# on GitHub's runners - which already carry the Android SDK - and the finished
# file is attached to the run for download.
#
# Without the signing secrets this produces a debug APK: sideload it to try the
# real thing. With them it also produces the .aab that Play accepts.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'words.js'
      - 'sounds/**'
      - '*.png'
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed to publish the build as a release; the default token is read-only.
    permissions:
      contents: write
    # The secrets context cannot be read from a step's `if`, so the one question
    # that matters - has the upload key been added yet - is answered once here.
    env:
      HAS_UPLOAD_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Put the game inside the app
        run: |
          set -eux
          DEST=android/app/src/main/assets/www
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp index.html words.js manifest.json "$DEST"/
          cp ./*.png "$DEST"/
          cp -r sounds "$DEST"/sounds
          # sw.js is deliberately left out: it belongs to the website build.
          # The page already skips registering it off http(s), and there is
          # nothing to cache when every file is on the device to begin with.
          du -sh "$DEST"
          ls -la "$DEST"

      # The version is whatever the VERSION file at the top of the repo says.
      # Gradle reads the same file, so there is one number in one place; this
      # step only needs it for the release tag and title.
      - name: Read the version
        id: ver
        run: |
          set -eu
          V=$(tr -d ' \t\r\n' < VERSION)
          case "$V" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "VERSION must read like 1.2.3, but reads: $V" >&2; exit 1 ;;
          esac
          PATCH=${V##*.}
          echo "name=$V" >> "$GITHUB_OUTPUT"
          # x.y.0 is a release the studio asked for and becomes "latest"; a
          # x.y.N is a mini fix and is published quietly beside it, so the
          # bookmark keeps pointing at the last one they actually wanted.
          if [ "$PATCH" = "0" ]; then echo "headline=true" >> "$GITHUB_OUTPUT";
          else echo "headline=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build
        working-directory: android
        run: |
          set -eux
          gradle --no-daemon assembleDebug

      - name: Sign and bundle for Play, if the key is available
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          export KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore"
          gradle --no-daemon bundleRelease
          rm -f "$RUNNER_TEMP/upload.keystore"

      - name: Attach the results to this run
        uses: actions/upload-artifact@v4
        with:
          name: wordspyre-app
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab

      # Artifacts can only be had as a zip, and only by someone signed in, which
      # is a lot of tapping for the one thing the studio does after every build.
      # The same files are published as a release too: two plain links, no zip,
      # no sign-in, and "latest" always points at the newest one.
      - name: Publish the files as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.ver.outputs.name }}
          VERSION: ${{ steps.ver.outputs.name }}
          HEADLINE: ${{ steps.ver.outputs.headline }}
        run: |
          set -eu
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk "out/WORDSPYRE-test.apk"
          if ls android/app/build/outputs/bundle/release/*.aab >/dev/null 2>&1; then
            cp android/app/build/outputs/bundle/release/*.aab "out/WORDSPYRE-for-play.aab"
          fi
          NOTES="Version $VERSION, built from ${{ github.sha }}.

          **WORDSPYRE-for-play.aab** - upload this one to Play Console.
          **WORDSPYRE-test.apk** - install this one straight onto a phone to try it."
          # Several fixes can land on one version before it is released, so a
          # tag that already exists is refreshed rather than treated as a clash.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --title "WORDSPYRE $VERSION" --notes "$NOTES" \
              --prerelease="$([ "$HEADLINE" = true ] && echo false || echo true)" \
              --latest="$HEADLINE"
          else
            gh release create "$TAG" out/* --title "WORDSPYRE $VERSION" --notes "$NOTES" \
              $([ "$HEADLINE" = true ] && echo --latest || echo --prerelease)
          fi
