plugins { id 'com.android.application' }

// One file at the top of the repo decides the version, and it is changed by
// hand. It used to come from the GitHub run number, which climbs on every push
// whether or not anything was released, so the number on the store had no
// relation to what had actually shipped.
//
// Mini fixes move the last digit - 1.2.1, 1.2.2, 1.2.3. A release moves the
// middle one and resets the last - 1.3.0.
def versionFile = rootProject.file('../VERSION')
if (!versionFile.exists()) {
    throw new GradleException('VERSION is missing from the top of the repo')
}
def appVersionName = versionFile.text.trim()
if (!(appVersionName ==~ /\d+\.\d+\.\d+/)) {
    throw new GradleException("VERSION must read like 1.2.3, but reads: ${appVersionName}")
}
// Play will not take a version code it has already seen, and will not take one
// lower than the last. Deriving it from the name keeps it climbing on its own:
// 1.2.1 is 10201, 1.3.0 is 10300. Nothing to remember and nothing to type.
def parts = appVersionName.tokenize('.')
def appVersionCode = parts[0].toInteger() * 10000 + parts[1].toInteger() * 100 + parts[2].toInteger()

android {
    namespace 'com.wordspyre.game'
    compileSdk 36

    defaultConfig {
        // Must stay exactly this: Play identifies the app by it, and a different
        // value would be a different app rather than an update to this one.
        applicationId "com.wordspyre.game"
        minSdk 24
        targetSdk 36

        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            // Filled in only when the workflow has been given the upload key.
            // Without it the build still succeeds and produces a debug-signed
            // APK, which is enough to sideload and try.
            if (System.getenv("KEYSTORE_PATH")) {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // Android will not install two packages that share an applicationId
            // but were signed with different keys - it refuses outright with
            // "App not installed" rather than replacing anything. The test build
            // therefore gets its own id so it can sit beside the Play version
            // instead of fighting it.
            applicationIdSuffix ".debug"
            versionNameSuffix "-test"
            resValue "string", "app_name", "WORDSPYRE TEST"
        }
        release {
            resValue "string", "app_name", "WORDSPYRE"
            minifyEnabled false          // one activity; nothing to shrink but plenty to break
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_PATH")) signingConfig signingConfigs.release
        }
    }

    // The audio is already compressed; letting the packager squeeze it again
    // only slows the build and gains nothing.
    androidResources { noCompress 'mp3' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// appcompat and webkit each drag in a Kotlin standard library, at different
// versions. From Kotlin 1.8 the jdk7 and jdk8 halves were folded into the main
// artifact, so having both on the classpath means every class in them is
// declared twice and packaging fails. Pin one version and drop the old split
// halves - nothing here is written in Kotlin, this is only transitive baggage.
configurations.configureEach {
    resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24' }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.activity:activity:1.9.2'
}
