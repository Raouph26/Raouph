<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#191828" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Filament</title>
  </head>
  <body>
    <div id="app">
      <section id="screen-menu" class="screen">
        <div class="brand">
          <canvas id="brand-mark" width="132" height="132" aria-hidden="true"></canvas>
          <h1>Filament</h1>
          <p>Draw the quiet lines</p>
        </div>

        <div class="menu-cards">
          <button class="card card-primary" id="go-classic" type="button">
            <span class="card-title">Classic</span>
            <span class="card-bar"><span class="card-bar-fill" id="classic-fill"></span></span>
          </button>
          <button class="card" id="go-daily" type="button">
            <span class="card-title">Daily</span>
            <span class="card-bar"><span class="card-bar-fill" id="daily-fill"></span></span>
          </button>
          <button class="card" id="go-themes" type="button">
            <span class="card-title">Themes</span>
            <span class="card-bar"><span class="card-bar-fill" id="themes-fill"></span></span>
          </button>
        </div>

        <button class="ghost" id="menu-mute" type="button">Sound on</button>
      </section>

      <section id="screen-themes" class="screen" hidden>
        <header class="bar">
          <div class="bar-side">
            <button class="icon" id="themes-back" type="button" aria-label="Back">
              &#8249;
            </button>
          </div>
          <h2>Themes</h2>
          <div class="bar-side bar-side-end"><span class="bar-meta" id="themes-meta"></span></div>
        </header>
        <div class="scroll"><div id="theme-list" class="theme-list"></div></div>
      </section>

      <section id="screen-chapters" class="screen" hidden>
        <header class="bar">
          <div class="bar-side">
            <button class="icon" id="chapters-back" type="button" aria-label="Back">
              &#8249;
            </button>
          </div>
          <h2>Classic</h2>
          <div class="bar-side bar-side-end"><span class="bar-meta" id="chapters-meta"></span></div>
        </header>
        <div class="scroll"><div id="chapter-list" class="chapter-list"></div></div>
      </section>

      <section id="screen-stages" class="screen" hidden>
        <header class="bar">
          <div class="bar-side">
            <button class="icon" id="stages-back" type="button" aria-label="Back">
              &#8249;
            </button>
          </div>
          <h2 id="stages-title">Chapter 1</h2>
          <div class="bar-side bar-side-end"><span class="bar-meta" id="stages-meta"></span></div>
        </header>
        <div class="scroll"><div id="stage-grid" class="stage-grid"></div></div>
      </section>

      <section id="screen-game" class="screen" hidden>
        <header class="bar">
          <div class="bar-side">
            <button class="icon" id="game-back" type="button" aria-label="Back">
              &#8249;
            </button>
          </div>
          <div id="title">
            <span id="level-name">--</span>
            <span id="level-status"></span>
          </div>
          <div class="bar-side bar-side-end">
            <button class="icon" id="game-mute" type="button" aria-label="Mute sound">
              <span class="mute-glyph" aria-hidden="true"></span>
            </button>
            <button class="icon" id="reset" type="button" aria-label="Reset puzzle">
              &#8635;
            </button>
          </div>
        </header>
        <canvas id="board"></canvas>
        <nav id="nav">
          <button class="icon" id="prev" type="button" aria-label="Previous puzzle">
            &#8249;
          </button>
          <span id="progress"></span>
          <button class="icon" id="next" type="button" aria-label="Next puzzle">
            &#8250;
          </button>
        </nav>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
