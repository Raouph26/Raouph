<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12151c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Lyne-like</title>
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <button id="prev" aria-label="Previous puzzle">&#8249;</button>
        <div id="title">
          <span id="level-name">--</span>
          <span id="level-status"></span>
        </div>
        <button id="reset" aria-label="Reset puzzle">&#8635;</button>
        <button id="next" aria-label="Next puzzle">&#8250;</button>
      </header>
      <canvas id="board"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
