# Netlify serves this repo as-is. There is nothing to build - the game is one
# self-contained index.html - so there is no build command, and the site root is
# the publish directory.
[build]
  publish = "."

# The three files that change on every deploy must never be served from a stale
# cache, or a player keeps the old game long after a fix has gone out. This is
# what made a fresh upload still look like the previous one.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The spec asks for application/manifest+json. Netlify serves .json files as
# application/json, which most tools accept - but a strict store packager may
# not, so it is stated explicitly rather than left to chance.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

# The service worker decides when everything else updates, so it has to be the
# freshest file of the lot.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Artwork and audio are content-stable: the filename changes when the file does.
[[headers]]
  for = "/sounds/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Android checks this file to decide whether the app owns the domain. It must
# come back as JSON over https with no redirect, or the app opens with a browser
# address bar across the top instead of looking like a real app.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=300"
    Access-Control-Allow-Origin = "*"
